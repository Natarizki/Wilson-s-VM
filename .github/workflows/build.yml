name: Build WVM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson pkg-config libglib2.0-dev libpixman-1-dev libgtk-3-dev libsdl2-dev python3 python3-venv libcap-ng-dev libattr1-dev zlib1g-dev bzip2

      - name: Configure
        run: |
          ./configure --target-list=x86_64-softmmu,aarch64-softmmu,riscv64-softmmu --disable-kvm --disable-docs --disable-tools --disable-vnc --disable-spice --enable-trace-backends=nop --disable-guest-agent --disable-bsd-user --disable-linux-user --enable-gtk --enable-sdl --enable-tcg --extra-cflags="-O2"

      - name: Build
        run: |
          cd build
          ninja

      - name: Package artifacts
        run: |
          mkdir -p artifact/bin
          cp build/qemu-system-x86_64 artifact/bin/ || true
          cp build/qemu-system-aarch64 artifact/bin/ || true
          cp build/qemu-system-riscv64 artifact/bin/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wvm-binaries
          path: artifact/bin/
