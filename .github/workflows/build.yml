name: Build WVM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            host_arch: x86_64
          - runner: ubuntu-24.04-arm
            host_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson pkg-config libglib2.0-dev libpixman-1-dev libgtk-3-dev libsdl2-dev python3 python3-venv libcap-ng-dev libattr1-dev zlib1g-dev bzip2

      - name: Configure
        run: |
          ./configure --target-list=x86_64-softmmu,aarch64-softmmu,riscv64-softmmu --disable-kvm --disable-docs --disable-tools --disable-vnc --disable-spice --enable-trace-backends=nop --disable-guest-agent --disable-bsd-user --disable-linux-user --enable-gtk --enable-sdl --enable-tcg --extra-cflags="-O2"

      - name: Build
        run: |
          cd build
          ninja

      - name: Bundle shared libraries
        run: |
          mkdir -p build/lib
          for bin in build/qemu-system-x86_64 build/qemu-system-aarch64 build/qemu-system-riscv64; do
            ldd "$bin" | awk '{print $3}' | grep '^/' | while read -r lib; do
              cp -n "$lib" build/lib/ 2>/dev/null || true
            done
          done
          LINKER=$(ldd build/qemu-system-x86_64 | grep 'ld-linux' | awk '{print $1}')
          cp "$LINKER" build/lib/ || true
          echo "Bundled libraries:"
          ls -la build/lib/

      - name: Bundle into wvm-system-universal
        run: |
          chmod +x scripts/make-universal.sh
          ./scripts/make-universal.sh build
          mv wvm-system-universal wvm-system-universal-${{ matrix.host_arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wvm-system-universal-${{ matrix.host_arch }}
          path: wvm-system-universal-${{ matrix.host_arch }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WVM build ${{ github.run_number }}
          files: wvm-system-universal-${{ matrix.host_arch }}
